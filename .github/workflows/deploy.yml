name: Deploy Frontend to S3 and CloudFront

# Trigger this workflow whenever you push code to the main branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Download your repository code onto the GitHub runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configure AWS credentials using the secure secrets you stored
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2 # Change if your S3/CloudFront is in another region

      # 3. Sync your local files up to your S3 bucket
      - name: Deploy to S3
        run: |
          aws s3 sync . s3://tr-cloud-resume-bucket-2026 --delete --exclude ".git/*" --exclude ".github/*"

      # 4. Invalidate the CloudFront cache so users see changes instantly
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id EYEUJS5P1R9EJ --paths "/*"